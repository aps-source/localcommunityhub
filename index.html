  function fmtTime(ts){ return new Date(ts).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); }

  /* ---------- Voice announcements for new orders ---------- */
  function speak(text){
    if(!(window.speechSynthesis && window.SpeechSynthesisUtterance)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95; u.pitch = 1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function announceOrder(o){
    var itemsText = o.items.map(function(l){ return l.qty + " " + l.name; }).join(", ");
    speak("New order. Token " + o.tokenDisplay.replace(/-/g," ") + ". " + itemsText + ". " +
      (o.fulfilment === "DELIVERY" ? "Home delivery." : "Pickup."));
  }
  function announceOrderAction(o){
    var token = o.tokenDisplay.replace(/-/g," ");
    if(o.customerActionType === "CANCELLED"){
      speak("Order " + token + " was cancelled by the customer.");
    } else {
      var itemsText = o.items.map(function(l){ return l.qty + " " + l.name; }).join(", ");
      speak("Order " + token + " was updated by the customer. Now: " + itemsText + ".");
    }
  }
  // Only the owner's tab cares; only orders/actions since this device last checked get read
  // out, so re-opening the dashboard never re-announces the whole day's history. New orders
  // and customer-made changes (edits, cancellations) are tracked on separate cursors since
  // an edit/cancel doesn't touch createdAt.
  function checkNewOrdersAndAnnounce(){
    if(state.ui.role !== "owner" || !state.shop.voiceAnnounce) return;
    var lastNew = state.ui.lastSeenOrderTs || 0;
    var freshNew = state.orders.filter(function(o){ return o.createdAt > lastNew && o.serviceDate === todayStr() && o.status === "PENDING"; });

    var lastAction = state.ui.lastSeenCustomerActionTs || 0;
    var freshActions = state.orders.filter(function(o){ return o.customerActionAt && o.customerActionAt > lastAction && o.serviceDate === todayStr(); });

    if(freshNew.length === 0 && freshActions.length === 0) return;

    var events = [];
    freshNew.forEach(function(o){ events.push({ ts: o.createdAt, run: function(){ announceOrder(o); } }); });
    freshActions.forEach(function(o){ events.push({ ts: o.customerActionAt, run: function(){ announceOrderAction(o); } }); });
    events.sort(function(a,b){ return a.ts - b.ts; }).forEach(function(e){ e.run(); });

    state.ui.lastSeenOrderTs = nowMs();
    state.ui.lastSeenCustomerActionTs = nowMs();
    persist();
  }
  // Customer-side voice alert: reads out the same text as the WhatsApp status message
  // (statusUpdateText), so it's identical wording and already carries the
  // delivery-vs-pickup and paid-vs-due differences. First sighting of an order just sets
  // the baseline so opening the ticket never announces its current status out of nowhere;
  // only real transitions speak. PENDING/CANCELLED are skipped, same as the "Notify" button.
  function checkCustomerOrderAndAnnounce(){
    if(state.ui.role === "owner" || !state.ui.custVoiceAlert || !state.ui.activeOrderId) return;
    var o = state.orders.find(function(x){ return x.id === state.ui.activeOrderId; });
    if(!o) return;
    if(state.ui.voiceLastOrderId !== o.id){
      state.ui.voiceLastOrderId = o.id; state.ui.voiceLastStatus = o.status; persist(); return;
    }
    if(state.ui.voiceLastStatus !== o.status){
      state.ui.voiceLastStatus = o.status; persist();
      if(["ACCEPTED","PREPARING","READY","COMPLETED","REJECTED"].indexOf(o.status) !== -1) speak(statusUpdateText(o));
    }
  }
  // Merge shared shop/order data written by another tab of the same browser, without touching
  // this tab's own session (role, unlock state, cart, in-progress form fields).
  function mergeIncomingSharedState(incoming){
    state.hub = incoming.hub || state.hub;
    state.shop = Object.assign({}, DEFAULT_STATE.shop, incoming.shop || {});
    state.menu = (incoming.menu && incoming.menu.length) ? incoming.menu : state.menu;
    state.counter = incoming.counter || state.counter;
    state.orders = incoming.orders || state.orders;
    state.reviews = incoming.reviews || state.reviews;
  }
  window.addEventListener("storage", function(e){
    // Once Firebase is connected it's the single source of truth for shared data —
    // this same-browser-tab fallback is only for when the cloud is unreachable.
    if(cloud.enabled) return;
    if(e.key !== STORE_KEY || !e.newValue) return;
    var incoming;
    try{ incoming = JSON.parse(e.newValue); }catch(err){ return; }
    mergeIncomingSharedState(incoming);
    render(); // render() itself runs the new-order check, so any fresh order gets announced here
  });

  // Phones aggressively suspend background tabs — Firebase's listeners can be throttled
  // and miss firing a voice alert while the screen is off or another app is in front.
  // Catch up the moment the tab is looked at again instead of waiting for the next
  // unrelated render.
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ checkNewOrdersAndAnnounce(); checkCustomerOrderAndAnnounce(); render(); }
  });

  /* ---------- Cloud connect: subscribe to shared data, seed it if this is a brand-new DB ---------- */
  function seedCloudIfEmpty(){
    cloud.db.ref("shop").once("value").then(function(snap){
      if(snap.exists()) return;
      cloud.db.ref().update({
        hub: DEFAULT_STATE.hub,
        shop: DEFAULT_STATE.shop,
        menu: DEFAULT_STATE.menu,
        counter: DEFAULT_STATE.counter
      });
    }).catch(function(){});
  }
  function attachCloudListeners(){
    cloud.db.ref("hub").on("value", function(snap){ if(snap.exists()){ state.hub = snap.val(); render(); } });
    cloud.db.ref("shop").on("value", function(snap){ if(snap.exists()){ state.shop = Object.assign({}, DEFAULT_STATE.shop, snap.val()); render(); } });
    cloud.db.ref("menu").on("value", function(snap){
      if(!snap.exists()) return;
      state.menu = snap.val();
      var droppedAny = false;
      Object.keys(state.ui.cart).forEach(function(id){
        if(!state.menu.find(function(m){ return m.id === id; })){ delete state.ui.cart[id]; droppedAny = true; }
      });
      if(droppedAny){ persist(); toast("An item in your cart is no longer on the menu — it's been removed"); }
      render();
    });
    cloud.db.ref("counter").on("value", function(snap){ if(snap.exists()){ state.counter = snap.val(); } });
    cloud.db.ref("orders").on("value", function(snap){
      var val = snap.val();
      state.orders = val ? Object.keys(val).map(function(k){ var o = val[k]; o.id = k; return o; }) : [];
      render();
    });
    cloud.db.ref("reviews").on("value", function(snap){
      var val = snap.val();
      state.reviews = val ? Object.keys(val).map(function(k){ var r = val[k]; r.id = k; return r; }) : [];
      render();
    });
  }
  (function initCloud(){
    if(!(window.firebase && firebaseConfig && firebaseConfig.apiKey)) return;
    try{
      firebase.initializeApp(firebaseConfig);
      cloud.db = firebase.database();
      cloud.enabled = true;
      cloud.db.ref(".info/serverTimeOffset").on("value", function(snap){
        serverTimeOffsetMs = snap.val() || 0;
      });
      seedCloudIfEmpty();
      attachCloudListeners();
      initPush();
    }catch(e){ cloud.enabled = false; cloud.db = null; }
  })();

  // Registers the service worker that lets push notifications arrive even with the tab
  // closed. Getting/saving an actual device token only happens later, when the owner
  // explicitly taps "Enable notifications" — registering the worker alone asks for nothing.
  function initPush(){
    if(!("serviceWorker" in navigator) || !("PushManager" in window) || !firebase.messaging) return;
    if(!navigator.serviceWorker.register) return;
    navigator.serviceWorker.register("firebase-messaging-sw.js").then(function(reg){
      push.swReg = reg;
      push.messaging = firebase.messaging();
      push.supported = true;
    }).catch(function(){});
  }
  function enableNotifications(){
    if(!push.supported || !push.messaging){ toast("Notifications aren't supported in this browser."); return; }
    if(VAPID_PUBLIC_KEY === "PASTE_VAPID_KEY_HERE"){ toast("Ask the developer to finish setting up notifications first."); return; }
    Notification.requestPermission().then(function(permission){
      if(permission !== "granted"){ toast("Notification permission wasn't granted."); return; }
      push.messaging.getToken({ vapidKey: VAPID_PUBLIC_KEY, serviceWorkerRegistration: push.swReg }).then(function(token){
        if(!token){ toast("Couldn't get a notification token — try again."); return; }
        if(cloud.enabled) cloud.db.ref("fcmTokens/" + token).set({ addedAt: nowMs() });
        state.ui.pushEnabledHere = true;
        persist(); render();
        toast("Notifications enabled on this device");
      }).catch(function(){ toast("Couldn't enable notifications — try again."); });
    }).catch(function(){ toast("Couldn't enable notifications — try again."); });
  }

  function submitPin(){
    var entered = (state.ui.pinInput||"").trim();
    var expected = (state.shop.staffPin||"1234").trim();
    if(entered && entered === expected){
      state.ui.ownerUnlocked = true;
      state.ui.role = "owner";
      state.ui.showPin = false;
      state.ui.pinInput = "";
      state.ui.pinError = "";
      persist(); render(); toast("Owner dashboard unlocked");
    } else {
      state.ui.pinError = "Incorrect PIN — try again.";
      persist(); render();
      var el = document.getElementById("pin-input");
      if(el) el.focus();
    }
  }

  function submitCustLogin(){
    var name = (state.ui.custLoginName||"").trim();
    var phone = (state.ui.custLoginPhone||"").trim();
    if(!name){ state.ui.custLoginError = "Please enter your name."; persist(); render(); return; }
    if(!/^\d{10}$/.test(phone.replace(/\D/g,""))){ state.ui.custLoginError = "Please enter a valid 10-digit mobile number."; persist(); render(); return; }
    state.ui.name = name;
    state.ui.phone = phone.replace(/\D/g,"");
    state.ui.customerLoggedIn = true;
    state.ui.showCustLogin = false;
    state.ui.custLoginError = "";
    persist(); render(); toast("Welcome, " + name.split(" ")[0] + "!");
  }

  /* ============ Portal access ============
     The owner dashboard is reached only through the "Owner Login" link
     in the footer, gated by a PIN (set in Owner → Contact, default 1234).
     Customers on the plain link never see any control that leads there. */
  document.getElementById("btn-open-staff").addEventListener("click", function(){
    state.ui.showPin = true; state.ui.pinError = ""; state.ui.pinInput = "";
    persist(); render();
    setTimeout(function(){ var el = document.getElementById("pin-input"); if(el) el.focus(); }, 30);
  });
  document.getElementById("mode-pill-slot").addEventListener("click", function(e){
    var t = e.target;
    var r = attr(t,"data-staff-role");
    if(r){ state.ui.role = r; persist(); render(); return; }
    if(t.id === "btn-lock-staff" || attr(t,"data-lock-staff")){
      state.ui.ownerUnlocked = false; state.ui.role = "customer"; state.ui.customerStep = "welcome";
      persist(); render(); toast("Owner view locked"); return;
    }
    if(t.id === "btn-cust-login"){
      state.ui.showCustLogin = true; state.ui.custLoginError = "";
      state.ui.custLoginName = state.ui.name; state.ui.custLoginPhone = state.ui.phone;
      persist(); render();
      setTimeout(function(){ var el = document.getElementById("in-cust-login-name"); if(el) el.focus(); }, 30);
      return;
    }
    if(t.id === "btn-cust-logout"){
      state.ui.customerLoggedIn = false; state.ui.name = ""; state.ui.phone = "";
      persist(); render(); toast("Logged out");
    }
  });

  render();
})();
</script>
</body>
</html>
