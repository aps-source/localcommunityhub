<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSK Food Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#C98A12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vesper+Libre:wght@500;700&family=Karla:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>
  /* ============ Design tokens ============ */
  :root{
    --paper:#FBF6EC;
    --surface:#FFFFFF;
    --surface-2:#F3EBDA;
    --ink:#2A1D14;
    --ink-soft:#7A6753;
    --line:#E8DCC8;
    --gold:#C98A12;
    --gold-ink:#7A560D;
    --gold-soft:#F3E1B4;
    --green:#4F7A3D;
    --green-soft:#E1EDD7;
    --red:#B23A2E;
    --red-soft:#F5DEDA;
    --teal:#2F4A43;
    --teal-soft:#DCE7E3;
    --shadow: 0 1px 2px rgba(42,29,20,.05), 0 4px 10px -6px rgba(42,29,20,.12), 0 14px 32px -16px rgba(42,29,20,.20);
    --shadow-lift: 0 2px 4px rgba(42,29,20,.08), 0 18px 36px -14px rgba(42,29,20,.30);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B140D;
      --surface:#241B12;
      --surface-2:#2E2216;
      --ink:#F3E9DA;
      --ink-soft:#B7A48D;
      --line:#3A2E20;
      --gold:#E0A530;
      --gold-ink:#F6D48A;
      --gold-soft:#3E3116;
      --green:#7FAE68;
      --green-soft:#26331F;
      --red:#E2685A;
      --red-soft:#3B231F;
      --teal:#6FA69A;
      --teal-soft:#1E2E2A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 14px -8px rgba(0,0,0,.45), 0 16px 32px -14px rgba(0,0,0,.6);
      --shadow-lift: 0 2px 5px rgba(0,0,0,.35), 0 20px 40px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B140D;
    --surface:#241B12;
    --surface-2:#2E2216;
    --ink:#F3E9DA;
    --ink-soft:#B7A48D;
    --line:#3A2E20;
    --gold:#E0A530;
    --gold-ink:#F6D48A;
    --gold-soft:#3E3116;
    --green:#7FAE68;
    --green-soft:#26331F;
    --red:#E2685A;
    --red-soft:#3B231F;
    --teal:#6FA69A;
    --teal-soft:#1E2E2A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 14px -8px rgba(0,0,0,.45), 0 16px 32px -14px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 5px rgba(0,0,0,.35), 0 20px 40px -16px rgba(0,0,0,.7);
  }

  *{ box-sizing:border-box; }
  html{ color-scheme: light dark; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Karla',-apple-system,'Segoe UI',sans-serif;
    font-size:15.5px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Vesper Libre', Georgia, serif; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a{ color: var(--gold-ink); }
  button{ font-family:inherit; }
  ::selection{ background: var(--gold-soft); }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 8px 18px 72px; }

  /* ============ Top bar ============ */
  .topbar{
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner{
    max-width:1080px; margin:0 auto; padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:40px; height:40px; border-radius:11px; flex:none;
    background: linear-gradient(155deg, var(--gold), var(--red));
    display:flex; align-items:center; justify-content:center; font-size:20px;
    box-shadow: 0 6px 14px -6px rgba(178,58,46,.4);
  }
  .brand h1{ font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .brand p{ margin:2px 0 0; font-size:11.5px; color:var(--ink-soft); letter-spacing:.05em; text-transform:uppercase; }

  .mode-pill{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px;
    font-weight:800; font-size:12.5px; letter-spacing:.02em; background:var(--teal-soft); color:var(--teal);
  }
  .staff-switch{ display:flex; align-items:center; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px; }
  .staff-btn{
    border:none; background:transparent; padding:8px 14px; border-radius:999px;
    font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .staff-btn[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
  .staff-btn:hover:not([aria-pressed="true"]){ color:var(--ink); }
  .staff-btn.lock{ font-size:14px; padding:8px 10px; }

  .staff-link{
    background:none; border:none; color:var(--ink-soft); font-size:11px; text-decoration:underline;
    cursor:pointer; padding:2px 0; font-family:inherit;
  }
  .staff-link:hover{ color:var(--ink); }

  .cust-id-box{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .cust-id-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-weight:700; font-size:12.5px;
    padding:7px 14px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .cust-id-btn:hover{ color:var(--ink); border-color:var(--teal); }
  .cust-id-btn.primary{ background:var(--gold); border-color:var(--gold); color:#241B12; }
  .cust-id-btn.primary:hover{ color:#241B12; opacity:.9; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,14,8,.5); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:60;
  }
  .modal-card{
    background:var(--surface); border-radius:16px; padding:22px; width:100%; max-width:320px; box-shadow:var(--shadow);
  }
  .modal-card h3{ font-size:17px; margin-bottom:4px; }
  .modal-card .sub{ margin-bottom:14px; }
  .modal-card input{ text-align:center; letter-spacing:.3em; font-family:'IBM Plex Mono'; font-size:18px; }

  /* ============ Status ribbon ============ */
  .ribbon{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 18px; margin: 18px 0 0; border-radius:14px;
    background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
    font-size:12.5px; font-weight:700; letter-spacing:.02em; white-space:nowrap;
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; }
  .badge-open{ background:var(--green-soft); color:var(--green); }
  .badge-open .dot{ background:var(--green); }
  .badge-closed{ background:var(--red-soft); color:var(--red); }
  .badge-closed .dot{ background:var(--red); }
  .badge-holiday{ background:var(--gold-soft); color:var(--gold-ink); }
  .badge-holiday .dot{ background:var(--gold); }
  .ribbon .shop-name{ font-weight:700; }
  .ribbon .reason{ color:var(--ink-soft); font-size:13.5px; }
  .ribbon .spacer{ flex:1; }
  .ribbon .eta-chip{
    font-family:'IBM Plex Mono'; font-weight:600; font-size:13px;
    background:var(--surface-2); padding:5px 10px; border-radius:8px; color:var(--ink);
  }

  /* ============ Generic layout bits ============ */
  .grid2{ display:grid; grid-template-columns: 1fr; gap:20px; margin-top:18px; }
  @media (min-width: 880px){ .grid2{ grid-template-columns: 1.5fr 1fr; align-items:start; } }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:22px 22px 24px; box-shadow:var(--shadow);
    transition: box-shadow .2s ease;
  }
  .card + .card{ margin-top:20px; }
  .card h2{ font-size:19px; margin-bottom:5px; letter-spacing:-.01em; }
  .card .sub{ color:var(--ink-soft); font-size:13px; line-height:1.55; margin:0 0 16px; }
  .section-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; margin: 0 0 12px; display:flex; align-items:center; gap:7px; }
  .section-title::before{ content:""; width:3px; height:12px; border-radius:2px; background:var(--gold); flex:none; }

  .accent-customer{ box-shadow: inset 3px 0 0 var(--gold), var(--shadow); }
  .shop-quick-actions{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .edit-order-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--gold-soft); border-radius:12px; padding:14px; margin-bottom:16px;
  }
  .cancel-confirm{ background:var(--red-soft); border-radius:10px; padding:12px; margin-top:8px; }
  .accent-owner{ box-shadow: inset 3px 0 0 var(--teal), var(--shadow); }

  /* ============ Buttons / inputs ============ */
  .btn{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    padding:9px 16px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition: transform .08s, background .15s;
  }
  .btn:hover{ background: var(--line); }
  .btn:active{ transform: scale(.98); }
  .btn-primary{ background: var(--gold); border-color: var(--gold); color:#1B140D; font-weight:800; }
  .btn-primary:hover{ filter:brightness(1.05); background:var(--gold); transform:translateY(-1px); box-shadow:0 10px 20px -10px rgba(201,138,18,.55); }
  .btn-owner{ background: var(--teal); border-color: var(--teal); color:#fff; font-weight:800; }
  .btn-owner:hover{ filter:brightness(1.08); background:var(--teal); transform:translateY(-1px); box-shadow:0 10px 20px -10px rgba(47,74,67,.5); }
  .btn-danger{ background: var(--red-soft); border-color: var(--red-soft); color: var(--red); }
  .btn-danger:hover{ background: var(--red); color:#fff; }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn[data-full]{ width:100%; justify-content:center; }

  label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=tel], input[type=date], input[type=number], textarea, select{
    width:100%; background:var(--paper); border:1px solid var(--line); border-radius:9px;
    padding:9px 11px; font-family:inherit; font-size:14px; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:56px; }
  .field{ margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .err{ font-size:11.5px; color:var(--red); margin-top:4px; }

  .switch{ position:relative; width:44px; height:25px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .track{
    position:absolute; inset:0; background:var(--line); border-radius:999px; cursor:pointer; transition:background .15s;
  }
  .switch .track::after{
    content:""; position:absolute; width:19px; height:19px; left:3px; top:3px; border-radius:50%;
    background:var(--surface); transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + .track{ background:var(--green); }
  .switch input:checked + .track::after{ transform:translateX(19px); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    border:1px solid var(--line); background:var(--surface-2); padding:6px 11px; border-radius:999px;
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  /* ============ Menu list ============ */
  .menu-row{
    display:flex; align-items:center; gap:14px; padding:15px 0; border-bottom:1px dashed var(--line);
    transition: padding .15s ease;
  }
  .menu-row:last-child{ border-bottom:none; }
  .menu-row .info{ flex:1; min-width:0; }
  .menu-row .name{ font-weight:700; font-size:15.5px; letter-spacing:-.005em; }
  .menu-row .local{ color:var(--ink-soft); font-size:12.5px; margin-top:2px; }
  .menu-row .price{
    font-family:'IBM Plex Mono'; font-weight:700; font-size:15px; min-width:56px; text-align:right;
    color:var(--gold-ink);
  }
  .special-flag{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-ink); background:var(--gold-soft); padding:2px 7px; border-radius:6px; margin-left:8px; }
  .unavailable-flag{ font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--red); background:var(--red-soft); padding:2px 7px; border-radius:6px; margin-left:8px; }

  .stepper{ display:flex; align-items:center; gap:10px; flex:none; }
  .stepper button{
    width:28px; height:28px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2);
    font-size:16px; font-weight:700; cursor:pointer; color:var(--ink); line-height:1;
    transition: background .12s ease, transform .12s ease;
  }
  .stepper button:hover{ background:var(--line); transform:translateY(-1px); }
  .stepper button:active{ transform:translateY(0); }
  .stepper .qty{ min-width:18px; text-align:center; font-weight:800; font-family:'IBM Plex Mono'; font-size:14.5px; }
  .add-btn{
    border:1px solid var(--gold); color:var(--gold-ink); background:var(--gold-soft); border-radius:9px;
    padding:7px 15px; font-weight:800; font-size:12.5px; letter-spacing:.02em; cursor:pointer; flex:none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .add-btn:hover{ filter:brightness(1.03); transform:translateY(-1px); box-shadow:0 6px 14px -8px rgba(201,138,18,.55); }
  .add-btn:active{ transform:translateY(0); }

  /* ============ Cart ============ */
  .cart-line{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; font-size:14px; }
  .cart-line .x{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; padding:2px 6px; }
  .cart-line .x:hover{ color:var(--red); }
  .cart-total{ display:flex; justify-content:space-between; padding-top:10px; margin-top:6px; border-top:1px dashed var(--line); font-weight:800; font-size:16px; }
  .empty-note{ color:var(--ink-soft); font-size:13.5px; padding:8px 0; }

  .fulfil-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .fulfil-toggle button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    font-weight:700; font-size:13px; cursor:pointer; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .fulfil-toggle button[aria-pressed="true"]{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold-ink); }
  .fulfil-toggle button:disabled{ opacity:.4; cursor:not-allowed; }
  .fulfil-toggle small{ font-weight:500; color:var(--ink-soft); font-size:10.5px; }

  /* ============ Ticket ============ */
  .ticket{
    display:flex; border-radius:20px; overflow:hidden; box-shadow:var(--shadow-lift);
    border:1px solid var(--line); background:var(--surface); position:relative;
  }
  .ticket-stub{
    background: var(--ink); color: var(--paper); flex:none; width:122px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:18px 8px;
    position:relative;
  }
  .ticket-stub .lbl{ font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; opacity:.65; }
  .ticket-stub .code{ font-family:'IBM Plex Mono'; font-weight:700; font-size:23px; letter-spacing:.01em; color:var(--gold-soft); }
  .ticket-seam{ width:0; border-left:2px dashed var(--line); position:relative; flex:none; }
  .ticket-seam::before, .ticket-seam::after{
    content:""; position:absolute; left:-11px; width:22px; height:22px; border-radius:50%; background:var(--paper);
  }
  .ticket-seam::before{ top:-11px; }
  .ticket-seam::after{ bottom:-11px; }
  .ticket-body{ flex:1; padding:18px 20px; min-width:0; }
  .ticket-body .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ticket-body h3{ font-size:16px; }
  .ticket-body .status-pill{ flex:none; }
  @media (max-width: 560px){
    .ticket{ flex-direction:column; }
    .ticket-stub{ width:auto; flex-direction:row; padding:12px 18px; }
    .ticket-seam{ display:none; }
    .ticket-body{ border-top:2px dashed var(--line); }
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
  }
  .st-PENDING{ background:var(--surface-2); color:var(--ink-soft); }
  .st-ACCEPTED{ background:var(--teal-soft); color:var(--teal); }
  .st-PREPARING{ background:var(--gold-soft); color:var(--gold-ink); }
  .st-READY{ background:var(--green-soft); color:var(--green); }
  .st-COMPLETED{ background:var(--surface-2); color:var(--ink-soft); }
  .st-REJECTED, .st-CANCELLED{ background:var(--red-soft); color:var(--red); }

  .stepper-track{ display:flex; align-items:center; margin: 16px 0 6px; }
  .stepper-track .seg{ flex:1; height:4px; background:var(--line); border-radius:2px; margin:0 3px; }
  .stepper-track .seg.done{ background:var(--green); }
  .stepper-track .seg.now{ background:var(--gold); }
  .stepper-labels{ display:flex; font-size:10px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; justify-content:space-between; margin-bottom:12px;}
  .stepper-labels span{ display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
  .stepper-labels b{ font-family:'IBM Plex Mono'; font-weight:700; font-size:9px; letter-spacing:0; text-transform:none; color:var(--ink-soft); }

  .kv-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px; border-bottom:1px solid var(--line); }
  .kv-row:last-child{ border-bottom:none; }
  .kv-row .k{ color:var(--ink-soft); }
  .kv-row .v{ font-weight:700; }

  .upi-box{ text-align:center; background:var(--surface-2); border-radius:12px; padding:16px; margin-top:14px; }
  .upi-box-head{ font-weight:800; font-size:13.5px; margin-bottom:10px; }
  .upi-qr-img{
    width:180px; height:180px; display:block; margin:0 auto 12px; border-radius:8px;
    background:var(--surface); box-shadow:var(--shadow);
  }
  .upi-app-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .upi-app-btn{
    display:inline-flex; align-items:center; padding:9px 16px; border-radius:10px;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-weight:700; font-size:12.5px; text-decoration:none;
  }
  .upi-app-btn:hover{ border-color:var(--gold); }

  .review-box{ text-align:center; background:var(--surface-2); border-radius:12px; padding:16px; margin-top:14px; }
  .review-box-head{ font-weight:800; font-size:13.5px; margin-bottom:10px; }
  .star-row{ display:flex; justify-content:center; gap:4px; margin-bottom:10px; }
  .star-btn{ background:none; border:none; font-size:28px; line-height:1; color:var(--line); cursor:pointer; padding:2px; }
  .star-btn.on{ color:var(--gold); }
  .review-box textarea{ margin-bottom:10px; }

  /* ============ Owner: stat tiles ============ */
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:640px){ .stat-grid{ grid-template-columns:repeat(4,1fr); } }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:15px 17px; box-shadow:var(--shadow); }
  .stat-tile .num{ font-family:'IBM Plex Mono'; font-size:25px; font-weight:700; color:var(--gold-ink); }
  .stat-tile .lbl{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }

  /* ============ Owner: tabs + orders page ============ */
  .owner-tabs{ display:flex; gap:6px; margin-top:18px; }
  .owner-tab-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-weight:700; font-size:13.5px;
    padding:9px 16px; border-radius:10px; cursor:pointer;
  }

<script>
(function(){

  /* ============ Cloud sync (Firebase Realtime Database) ============

  var firebaseConfig = {
    apiKey: "AIzaSyC-rjzReNuth3LV3Pl9-dTzgqfcUtwyYqc",

  var serverTimeOffsetMs = 0;

  var STORE_KEY = "dsk_food_hub_v1";

  function todayStr(){

    if(!s) return "";

  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  var DEFAULT_STATE = {
    hub: { name: "DSK Food Hub" },
    shop: {
      name: "Shri Swami Samartha Bhakri Kendra",
      local: "श्री स्वामी समर्थ भाकरी केंद्र",

      addressLocal: "पत्ता - सर्व्हे नं. १२६, शॉप नं. एच-१७, भास्करा डि.एस.के. विश्व, पुणे-४११०४१",
      mapsUrl: "",

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);

    if(state.ui.activeOrderId){

    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var toastTimer=null;
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  /* ============ Derived / business logic ============ */
  var WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var WEEKDAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // A shop can run one shift or two (e.g. morning + evening with an afternoon break).
  // Returns the configured windows as ["HH:MM","HH:MM"] pairs, in order, skipping any
  // half that hasn't been set.
  function shopHourWindows(shop){
    var windows = [];
    if(shop.openTime1 && shop.closeTime1) windows.push([shop.openTime1, shop.closeTime1]);
    if(shop.openTime2 && shop.closeTime2) windows.push([shop.openTime2, shop.closeTime2]);
    return windows;
  }
  function shopHoursStatus(shop, hhmm){
    var windows = shopHourWindows(shop);
    if(windows.length === 0) return { open: true };
    for(var i=0; i<windows.length; i++){
      if(hhmm >= windows[i][0] && hhmm <= windows[i][1]) return { open: true };
    }
    var nextToday = null;
    for(var j=0; j<windows.length; j++){
      if(hhmm < windows[j][0] && (nextToday === null || windows[j][0] < nextToday)) nextToday = windows[j][0];
    }
    if(nextToday !== null){
      var beforeEverything = hhmm < windows[0][0];
      return { open:false, reason: (beforeEverything ? "Opens today at " : "On a break — opens again at ") + formatTime12(nextToday) };
    }

  }
  function formatShopHours(shop){
    return shopHourWindows(shop).map(function(w){ return formatTime12(w[0]) + "–" + formatTime12(w[1]); }).join(", ");
  }

  // Precedence, matching how a real hub's status is decided:
  // holiday dates > manual emergency closure > weekly off day > opening hours > open.
  function computeShopState(){
    var shop = state.shop, today = todayStr();
    if(shop.holidayFrom && shop.holidayTo && today >= shop.holidayFrom && today <= shop.holidayTo){
      return { state:"HOLIDAY", reason: shop.holidayReason, until: shop.holidayTo };
    }
    if(!shop.isOpenManual){
      return { state:"CLOSED", reason: shop.closureReason || "Closed for now" };
    }
    var now = new Date(nowMs());
    var dow = now.getDay();
    if((shop.weeklyHolidays||[]).indexOf(dow) !== -1){
      return { state:"CLOSED", reason: "Weekly off (" + WEEKDAY_NAMES[dow] + ")" };
    }
    var hhmm = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    var hours = shopHoursStatus(shop, hhmm);
    if(!hours.open) return { state:"CLOSED", reason: hours.reason };
    return { state:"OPEN" };
  }

  function todaysOrders(){
    var today = todayStr();
    return state.orders.filter(function(o){ return o.serviceDate === today; });
  }
  var ACTIVE_STATUSES = ["PENDING","ACCEPTED","PREPARING"];
  function activeOrdersAheadOf(seq){
    return todaysOrders().filter(function(o){
      return ACTIVE_STATUSES.indexOf(o.status) !== -1 && o.tokenSeq < seq;
    }).length;
  }
  function computeEta(activeAhead){
    var slots = Math.max(1, state.shop.parallelSlots||2);
    var avg = Math.max(1, state.shop.avgPrepMinutes||8);
    var minutes = Math.ceil((activeAhead+1)/slots) * avg;
    return { min: minutes, max: minutes + Math.max(4, Math.round(minutes*0.4)) };
  }

    var today = todayStr();
    if(state.counter.date !== today){ state.counter = { date: today, next: 1 }; }

  // Month/weekday initials aren't all unique (e.g. Jan/Jun/Jul share "J", Tue/Thu share "T")
  // — that's an accepted trade-off for a short, at-a-glance code; the day number next to the
  // month letter and the real date shown elsewhere on the ticket resolve any ambiguity.
  var MONTH_INITIALS = ["J","F","M","A","M","J","J","A","S","O","N","D"];
  var WEEKDAY_INITIALS = ["S","M","T","W","T","F","S"];
  function tokenDisplay(seq){
    var now = new Date(nowMs());
    var dateCode = MONTH_INITIALS[now.getMonth()] + now.getDate() + WEEKDAY_INITIALS[now.getDay()];
    return state.shop.tokenPrefix + "-" + dateCode + "-" + String(seq).padStart(3,"0");
  }

  // Optimistic local update (instant UI) + write-through to Firebase when connected.
  function updateShop(patch){
    Object.assign(state.shop, patch);
    if(cloud.enabled){
      cloud.db.ref("shop").update(patch).catch(function(){
        toast("Couldn't save that change — check your connection and try again.");
      });
    }
    persist(); render();
  }
  // Applies `mutator` to a local optimistic copy immediately (instant feedback), and
  // separately re-applies the SAME mutator inside a Firebase transaction against whatever
  // the server's current menu actually is. That second application is what makes two
  // owner devices editing the menu at the same moment safe — a transaction re-reads and
  // re-applies rather than blindly overwriting with a snapshot that might already be stale.
  function mutateMenuCloud(mutator){
    state.menu = mutator(state.menu.slice());
    persist(); render();
    if(cloud.enabled){
      cloud.db.ref("menu").transaction(function(current){
        return mutator((current || []).slice());
      }, function(error){
        if(error) toast("Could not save the menu change — try again.");
      });
    }
  }
  // Keys may be "slash/paths" (e.g. "stageTimes/ACCEPTED") so a nested field can be set
  // without overwriting its siblings — same shape locally as in a Firebase multi-path update.
  function setDeep(obj, path, value){
    var parts = path.split("/"), cur = obj;
    for(var i=0; i<parts.length-1; i++){
      if(typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length-1]] = value;
  }
  function patchOrderCloud(id, patch){
    var o = state.orders.find(function(x){ return x.id === id; });
    if(o) Object.keys(patch).forEach(function(k){ setDeep(o, k, patch[k]); });
    if(cloud.enabled){
      var multi = {};
      Object.keys(patch).forEach(function(k){ multi["orders/" + id + "/" + k] = patch[k]; });
      cloud.db.ref().update(multi).catch(function(){
        toast("Couldn't save that order update — check your connection and try again.");
      });
    }
    persist();
  }

  function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

  function badgeForStatus(cs){
    if(cs.state === "OPEN") return '<span class="badge badge-open"><span class="dot"></span>Open now</span>';
    if(cs.state === "HOLIDAY") return '<span class="badge badge-holiday"><span class="dot"></span>On leave</span>';
    return '<span class="badge badge-closed"><span class="dot"></span>Closed</span>';
  }

  /* ---------- WhatsApp deep links (tap-to-send, no backend required) ---------- */
  function digitsOnly(s){ return String(s||"").replace(/\D/g,""); }
  function toWaNumber(raw){
    var d = digitsOnly(raw);
    if(!d) return "";
    if(d.length === 10) return "91" + d;
    return d;
  }
  function telLink(raw){
    var n = toWaNumber(raw);
    return n ? ("tel:+" + n) : "";
  }
  function mapsLink(){
    var custom = (state.shop.mapsUrl||"").trim();
    if(custom) return custom;
    var q = (state.shop.address||state.shop.name||"").trim();
    return q ? ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q)) : "";
  }
  function waLink(rawNumber, text){
    var n = toWaNumber(rawNumber);
    if(!n) return "";
    return "https://wa.me/" + n + "?text=" + encodeURIComponent(text);
  }

  /* ---------- UPI QR (static deep link — the owner still confirms receipt manually,
     same trust model as marking cash paid; there's no gateway verifying this) ---------- */
  function upiQueryString(order){
    var vpa = (state.shop.upiId||"").trim();
    if(!vpa) return "";
    var payee = (state.shop.upiPayeeName||state.shop.name||"").trim();
    // NPCI's own spec examples always show two decimal places (e.g. "70.00") — some UPI
    // apps are strict about this even though a bare integer is technically valid too.
    var amount = Number(order.total || 0).toFixed(2);
    return "pa=" + encodeURIComponent(vpa) +
      "&pn=" + encodeURIComponent(payee) +
      "&am=" + amount +
      "&cu=INR&tn=" + encodeURIComponent("Order " + order.tokenDisplay);
  }
  // Android/iOS can silently default the generic upi:// scheme to whichever app last
  // claimed it (often WhatsApp, since WhatsApp Pay registers as a handler too) — separate
  // app-specific schemes let the customer pick GPay/PhonePe/Paytm directly, bypassing that.
  function buildUpiAppLinks(order){
    var qs = upiQueryString(order);
    if(!qs) return null;
    return {
      generic: "upi://pay?" + qs,
      gpay: "tez://upi/pay?" + qs,
      phonepe: "phonepe://pay?" + qs,
      paytm: "paytmmp://pay?" + qs
    };
  }
  function renderUpiQr(){
    var img = document.getElementById("upi-qr-img");
    if(!img || !window.QRious) return;
    var uri = img.getAttribute("data-uri");
    if(!uri) return;
    var logo = state.shop.qrLogoDataUrl;
    if(!logo){
      try{ new QRious({ element: img, value: uri, size: 200, level: "M" }); }catch(e){}
      return;
    }
    // With a logo, render to an offscreen canvas at the highest error-correction level
    // (tolerates ~30% obstruction) before overlaying the image, so the code still scans.
    // Loading the logo is asynchronous even for a data: URL — if another Firebase update
    // triggers a re-render in that gap, the original <img> node gets replaced, so we
    // re-fetch the live element by id right before writing instead of trusting the
    // closured reference (which may by then be detached and invisible).
    try{
      var canvas = document.createElement("canvas");
      new QRious({ element: canvas, value: uri, size: 200, level: "H" });
      var ctx = canvas.getContext("2d");
      var logoImg = new Image();
      var paint = function(){
        var dataUrl = canvas.toDataURL("image/png");
        var liveImg = document.getElementById("upi-qr-img");
        if(liveImg && liveImg.getAttribute("data-uri") === uri) liveImg.src = dataUrl;
      };
      var finish = function(){
        var logoSize = Math.round(canvas.width * 0.22);
        var pad = 6;
        var x = (canvas.width - logoSize) / 2, y = (canvas.height - logoSize) / 2;
        ctx.fillStyle = "#fff";
        ctx.fillRect(x - pad, y - pad, logoSize + pad*2, logoSize + pad*2);
        try{ ctx.drawImage(logoImg, x, y, logoSize, logoSize); }catch(e){}
        paint();
      };
      logoImg.onload = finish;
      logoImg.onerror = paint;
      logoImg.src = logo;
    }catch(e){}
  }
  // Downscales/crops an uploaded photo to a small square before storing it, so the shop
  // logo saved to the database stays a few KB rather than a full-size phone photo.
  function processQrLogoFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var size = 120;
        var canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext("2d");
        var srcSize = Math.min(img.width, img.height);
        var sx = (img.width - srcSize) / 2, sy = (img.height - srcSize) / 2;
        ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
        updateShop({ qrLogoDataUrl: canvas.toDataURL("image/jpeg", 0.85) });
        toast("QR logo saved");
      };
      img.onerror = function(){ toast("Couldn't read that image — try a different file."); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function orderSummaryText(o){
    var lines = o.items.map(function(l){ return "- " + l.qty + "x " + l.name + " (" + money(l.price) + ")"; }).join("\n");
    var addr = o.fulfilment === "DELIVERY" ? ("\nDeliver to: " + o.address) : "";
    return "New order — " + state.shop.name + "\n" +
      "Token: " + o.tokenDisplay + "\n" +
      (o.fulfilment === "DELIVERY" ? "Home delivery" : "Pickup") + "\n" +
      lines + "\n" +
      "Total: " + money(o.total) + " (pay at hub)\n" +
      "Name: " + o.name + "\nPhone: " + o.phone + addr +
      (o.notes ? ("\nNotes: " + o.notes) : "");
  }
  function statusUpdateText(o){
    if(o.status === "ACCEPTED"){
      var ahead = activeOrdersAheadOf(o.tokenSeq), eta = computeEta(ahead);
      return "Hi " + o.name + ", your order " + o.tokenDisplay + " at " + state.shop.name + " is accepted. Estimated wait " + eta.min + "-" + eta.max + " min. We'll message when it's ready.";
    }
    if(o.status === "PREPARING") return "Your order " + o.tokenDisplay + " at " + state.shop.name + " is being prepared.";
    if(o.status === "READY") return "Your token " + o.tokenDisplay + " is READY at " + state.shop.name + "! " +
      (o.fulfilment === "DELIVERY" ? "Your delivery is on the way. " : "Please collect at the counter. ") +
      (o.paymentStatus === "PAID" ? "Already paid — thank you!" : "Amount due: " + money(o.total) + ".");
    if(o.status === "REJECTED") return "Sorry, your order " + o.tokenDisplay + " at " + state.shop.name + " could not be accepted" + (o.rejectReason ? (": " + o.rejectReason) : ".");
    if(o.status === "COMPLETED"){
      var due = o.paymentStatus !== "PAID" ? (" Amount due: " + money(o.total) + ".") : "";
      return (o.fulfilment === "DELIVERY" ?
        ("Your order " + o.tokenDisplay + " has been delivered! Thanks for ordering from " + state.shop.name + ".") :
        ("Your order " + o.tokenDisplay + " is completed! Thanks for ordering from " + state.shop.name + ".")) + due;
    }
    return "Update on your order " + o.tokenDisplay + " at " + state.shop.name + ": " + o.status;
  }

  /* ---------- Daily log: WhatsApp text summary + CSV export ---------- */
  function dailySummaryText(){
    var list = todaysOrders().slice().sort(function(a,b){ return a.tokenSeq - b.tokenSeq; });
    var completed = list.filter(function(o){ return o.status === "COMPLETED"; });
    var closedOut = list.filter(function(o){ return o.status === "REJECTED" || o.status === "CANCELLED"; });
    var stillOpen = list.filter(function(o){ return o.status !== "COMPLETED" && o.status !== "REJECTED" && o.status !== "CANCELLED"; });
    var sales = completed.reduce(function(s,o){ return s + o.total; }, 0);
    var pickup = list.filter(function(o){ return o.fulfilment === "PICKUP"; }).length;
    var delivery = list.length - pickup;

    var lines = [];
    lines.push("DSK Food Hub — daily summary");
    lines.push(state.shop.name + " · " + fmtDate(todayStr()));
    lines.push("");
    lines.push("Orders: " + list.length + "  (Completed " + completed.length + ", Rejected/cancelled " + closedOut.length + ", Still open " + stillOpen.length + ")");
    lines.push("Sales (completed): " + money(sales));
    lines.push("Pickup " + pickup + " · Delivery " + delivery);
    lines.push("");
    lines.push("Orders, oldest first:");
    list.forEach(function(o){
      lines.push(o.tokenDisplay + " " + o.status + " " + money(o.total) + " — " + o.items.map(function(l){ return l.qty+"x "+l.name; }).join(", "));
    });
    return lines.join("\n");
  }

  function csvEscape(v){
    var s = String(v==null ? "" : v);
    if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function buildOrdersCsv(){
    var rows = [["Token","Time","Customer","Phone","Fulfilment","Items","Amount","Status","Payment"]];
    todaysOrders().slice().sort(function(a,b){ return a.tokenSeq - b.tokenSeq; }).forEach(function(o){
      rows.push([
        o.tokenDisplay,
        new Date(o.createdAt).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),
        o.name, o.phone, o.fulfilment,
        o.items.map(function(l){ return l.qty+"x "+l.name; }).join("; "),
        o.total, o.status, o.paymentStatus
      ]);
    });
    return rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  }
  function downloadCsvDirect(){
    var blob = new Blob([buildOrdersCsv()], {type:"text/csv;charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "dsk-food-hub-orders-" + todayStr() + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("Orders file downloaded");
  }
  async function exportOrdersCsv(){
    if(!(window.claude && window.claude.use)){ downloadCsvDirect(); return; }
    try{
      var downloads = await window.claude.use("downloads");
      if(!downloads){ downloadCsvDirect(); return; }
      var res = await downloads.save({ filename: "dsk-food-hub-orders-" + todayStr() + ".csv", data: buildOrdersCsv() });
      toast(res.status === "saved" ? "Orders file saved" : "Orders file sent");
    }catch(e){
      if(e && e.code === "declined") return;
      toast("Couldn't save the file — try again.");
    }
  }

  /* ============ Rendering ============ */
  function render(){
    // Cloud updates can arrive and trigger a re-render at any moment, including while
    // someone is mid-keystroke in an unrelated field — restore focus/cursor afterward
    // so a live sync from another device never yanks the field out from under them.
    var active = document.activeElement, focusInfo = null;
    if(active && active.id && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")){
      focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
    }

    checkNewOrdersAndAnnounce(); checkCustomerOrderAndAnnounce();
    renderTopTabs();
    var showRibbon = state.ui.role === "owner" || state.ui.customerStep === "shop";
    var ribbon = document.getElementById("ribbon");
    if(showRibbon){ ribbon.style.display=""; renderRibbon(); } else { ribbon.style.display="none"; }
    var app = document.getElementById("app");
    app.innerHTML = (state.ui.role === "owner" ? ownerView() : customerView()) + renderPinPanel() + renderCustLoginPanel();
    bindEvents();
    renderUpiQr();

    if(focusInfo){
      var el = document.getElementById(focusInfo.id);
      if(el){
        el.focus();
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }

  function formatTime12(hhmm){

    var html = '<button class="crumb" id="btn-to-hubs">← All food hubs</button>';
    html += '<div class="profile-card">';
    html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">' + badgeForStatus(cs) +
      (ratingSummary ? ('<span class="rating-badge">⭐ ' + ratingSummary.avg.toFixed(1) + ' (' + ratingSummary.count + ')</span>') : '') + '</div>';
    html += '<h2 class="display" style="font-size:21px;margin-bottom:2px">' + esc(state.shop.name) + '</h2>';
    html += '<p class="sub" style="margin-bottom:0">' + esc(state.shop.local) + '</p>';

    html += '<div class="profile-section"><div class="lbl">Address</div>' +
      (state.shop.address ? ('<div>📍 ' + esc(state.shop.address) + '</div>') : '<div class="hint">Not added yet.</div>') +
      (state.shop.addressLocal ? ('<div class="hint" style="margin-top:2px">' + esc(state.shop.addressLocal) + '</div>') : '') +
      '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">' +
        (custCallLink ? ('<a class="btn btn-sm" href="' + esc(custCallLink) + '" style="text-decoration:none">📞 Call shop</a>') : '') +
        (custMapsLink ? ('<a class="btn btn-sm" href="' + esc(custMapsLink) + '" target="_blank" rel="noopener" style="text-decoration:none">📍 Get directions</a>') : '') +

      (weeklyOff.length ? ('<div class="hint" style="margin-top:2px">Closed every ' + weeklyOff.map(function(d){ return WEEKDAY_SHORT[d]; }).join("/") + '</div>') : '') +
      (cs.state !== "OPEN" && cs.reason ? ('<div class="hint" style="margin-top:2px">' + esc(cs.reason) + '</div>') : '') +

    html += '<div class="profile-section"><div class="lbl">Fulfilment</div><div>' +

      html += '<div class="profile-section"><div class="lbl">Recent reviews</div>';
      recent.forEach(function(r){
        html += '<div class="review-mini"><span class="stars">' + "★".repeat(r.rating) + '</span>' + esc(r.comment || "(no comment)") + '</div>';

  function renderShopPage(){
    var cs = computeShopState();
    var openForOrders = cs.state === "OPEN";
    var order = state.ui.activeOrderId ? state.orders.find(function(o){ return o.id === state.ui.activeOrderId; }) : null;

    var html = '<button class="crumb" id="btn-to-hubs">← All food hubs</button>';
    html += '<div class="grid2">';

    html += '<div>';

    var isEditingThisOrder = order && state.ui.editingOrderId === order.id;
    if(isEditingThisOrder){
      html += '<div class="edit-order-banner">';
      html += '<div><strong>Editing order ' + esc(order.tokenDisplay) + '</strong><div class="hint">Change items below, then save — this updates your existing order, it won\'t create a new one.</div></div>';
      html += '<button class="btn btn-ghost btn-sm" id="btn-cancel-edit">Cancel editing</button>';
      html += '</div>';
    } else if(order && order.status !== "COMPLETED" && order.status !== "REJECTED" && order.status !== "CANCELLED"){
      html += renderTicket(order);
    } else if(order){
      html += renderTicket(order);
      html += '<div style="margin-top:12px"><button class="btn btn-primary" id="btn-new-order">Place another order</button></div>';
    }

    html += '<div class="card accent-customer">';
    html += '<h2 class="display">' + esc(state.shop.name) + '</h2>';
    html += '<p class="sub">' + esc(state.shop.local) + '</p>';
    var custCallLink = telLink(state.shop.ownerWhatsapp), custMapsLink = mapsLink();
    if(custCallLink || custMapsLink){
      html += '<div class="shop-quick-actions">';
      if(custCallLink) html += '<a class="btn btn-sm" href="' + esc(custCallLink) + '" style="text-decoration:none">📞 Call shop</a>';
      if(custMapsLink) html += '<a class="btn btn-sm" href="' + esc(custMapsLink) + '" target="_blank" rel="noopener" style="text-decoration:none">📍 Get directions</a>';
      html += '</div>';
    }
    if(!openForOrders){
      html += '<div style="background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:var(--ink-soft)">Menu is browsable, but ordering opens again once the hub reopens.</div>';
    }
    html += '<div class="section-title">Menu</div>';
    if(state.menu.length === 0) html += '<div class="empty-note">No items on the menu right now.</div>';
    state.menu.forEach(function(item){
      if(item.showOnMenu === false) return;
      var qty = state.ui.cart[item.id] || 0;
      var isSpecial = item.id === state.shop.todaySpecialId;
      html += '<div class="menu-row">';
      html += '<div class="info"><span class="name">' + esc(item.name) + '</span>';
      if(isSpecial) html += '<span class="special-flag">★ Special</span>';
      if(item.occasion) html += '<span class="occasion-flag" style="margin-left:8px">🎉 ' + esc(item.occasion) + '</span>';
      if(!item.available) html += '<span class="unavailable-flag">Sold out</span>';
      html += '<div class="local">' + esc(item.local) + '</div></div>';
      html += '<div class="price">' + money(item.price) + '</div>';
      if(!item.available || !openForOrders){
        html += '<div style="width:96px"></div>';
      } else if(qty === 0){
        html += '<button class="add-btn" data-add="' + item.id + '">Add</button>';
      } else {
        html += '<div class="stepper"><button data-dec="' + item.id + '">−</button><span class="qty">' + qty + '</span><button data-inc="' + item.id + '">+</button></div>';
      }
      html += '</div>';
    });
    html += '</div>'; // card

    html += '</div>'; // left col

    html += '<div>' + renderCartPanel(openForOrders) + '</div>';
    html += '</div>'; // grid2
    return html;
  }

  function renderTicket(order){
    var stages = ["PENDING","ACCEPTED","PREPARING","READY","COMPLETED"];
    var idx = stages.indexOf(order.status);
    var ahead = activeOrdersAheadOf(order.tokenSeq);
    var eta = computeEta(ahead);
    var terminal = order.status === "REJECTED" || order.status === "CANCELLED";

    var html = '<div class="ticket" style="margin-bottom:16px">';
    html += '<div class="ticket-stub"><div class="lbl">Your token</div><div class="code">' + esc(order.tokenDisplay) + '</div></div>';
    html += '<div class="ticket-seam"></div>';
    html += '<div class="ticket-body">';
    html += '<div class="top-row"><div><h3>' + esc(state.shop.name) + '</h3><div class="hint" style="margin-top:2px">' + (order.fulfilment==="DELIVERY"?"🛵 Home delivery":"🚶 Pickup") + '</div></div>';
    html += '<span class="status-pill st-' + order.status + '">' + order.status + '</span></div>';

    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0">' +
      '<span class="hint">' + (state.ui.custVoiceAlert!==false ? '🔊 Voice alerts active' : '🔇 Voice alerts inactive') + '</span>' +
      '<label class="switch" title="Voice alerts"><input type="checkbox" id="tg-cust-voice" ' + (state.ui.custVoiceAlert!==false?'checked':'') + '><span class="track"></span></label>' +
      '</div>';

    if(!terminal){
      var stageLabels = ["Placed","Accepted","Preparing","Ready",completeLabel(order)];
      html += '<div class="stepper-track">';
      stages.forEach(function(s, i){ html += '<div class="seg ' + (i<idx?"done":(i===idx?"now":"")) + '"></div>'; });
      html += '</div>';
      html += '<div class="stepper-labels">';
      stages.forEach(function(s, i){
        var t = order.stageTimes && order.stageTimes[s];
        html += '<span>' + stageLabels[i] + (i<=idx && t ? ('<b>'+fmtTime(t)+'</b>') : '') + '</span>';
      });
      html += '</div>';
    } else {
      var termTime = order.stageTimes && order.stageTimes[order.status];
      html += '<div style="background:var(--red-soft);color:var(--red);border-radius:9px;padding:9px 12px;font-size:13px;margin:10px 0">' +
        (order.status==="REJECTED" ? "Not accepted" : "Cancelled") + (termTime ? (" · " + fmtTime(termTime)) : "") + (order.rejectReason ? " — " + esc(order.rejectReason) : "") + '</div>';
    }

    if(order.status === "PENDING" || order.status === "ACCEPTED" || order.status === "PREPARING"){
      html += '<div class="kv-row"><span class="k">Orders ahead</span><span class="v">' + ahead + '</span></div>';
      html += '<div class="kv-row"><span class="k">Estimated wait</span><span class="v">' + eta.min + '–' + eta.max + ' min</span></div>';
    }
    if(order.status === "READY"){
      html += '<div style="background:var(--green-soft);color:var(--green);border-radius:9px;padding:9px 12px;font-weight:700;font-size:13.5px;margin:8px 0">Ready — please ' + (order.fulfilment==="DELIVERY"?"expect your delivery now":"collect at the counter") + '</div>';
    }
    html += '<div class="kv-row"><span class="k">Amount due</span><span class="v">' + money(order.total) + ' · ' + (order.paymentStatus==="PAID" ? '<span class="paid-pill paid-PAID">Paid</span>' : '<span class="paid-pill paid-DUE">Pay at hub</span>') + '</span></div>';
    html += '<div class="kv-row"><span class="k">Items</span><span class="v" style="text-align:right;font-weight:600">' + order.items.map(function(l){ return l.qty+'× '+esc(l.name); }).join(', ') + '</span></div>';

    if(!terminal && order.paymentStatus !== "PAID"){
      var upiLinks = buildUpiAppLinks(order);
      if(upiLinks){
        html += '<div class="upi-box">';
        html += '<div class="upi-box-head">📱 Pay ' + money(order.total) + ' via UPI</div>';
        html += '<img id="upi-qr-img" data-uri="' + esc(upiLinks.generic) + '" alt="UPI QR code" class="upi-qr-img">';
        html += '<div class="upi-app-row">';
        html += '<a class="upi-app-btn" href="' + esc(upiLinks.gpay) + '">Google Pay</a>';
        html += '<a class="upi-app-btn" href="' + esc(upiLinks.phonepe) + '">PhonePe</a>';
        html += '<a class="upi-app-btn" href="' + esc(upiLinks.paytm) + '">Paytm</a>';
        html += '<a class="upi-app-btn" href="' + esc(upiLinks.generic) + '">Other UPI app</a>';
        html += '</div>';
        html += '<p class="hint">Scan the QR, or tap your app above on your phone. If a button doesn\'t open anything, that app isn\'t installed — try another. The shop marks this paid once they see it land, this isn\'t an automatic payment confirmation.</p>';
        html += '</div>';
      }
    }

    var shopWa = waLink(state.shop.ownerWhatsapp, orderSummaryText(order));
    if(order.status === "PENDING"){
      if(shopWa){
        html += '<a class="btn btn-primary" data-full href="' + shopWa + '" target="_blank" rel="noopener" style="margin-top:14px;text-decoration:none">📲 Send order to shop on WhatsApp</a>';
      } else {
        html += '<div class="hint" style="margin-top:12px">The shop hasn\'t added a WhatsApp number yet, so this can\'t be sent automatically — ask them to add one under Owner → Contact.</div>';
      }
    }
    var ticketCallLink = telLink(state.shop.ownerWhatsapp);
    if(ticketCallLink) html += '<a class="btn btn-sm btn-ghost" href="' + esc(ticketCallLink) + '" style="margin-top:8px;text-decoration:none">📞 Call shop</a>';

    var canManage = order.status === "PENDING" || order.status === "ACCEPTED";
    if(canManage){
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">';
      if(order.status === "PENDING") html += '<button class="btn btn-sm" data-edit-order="' + order.id + '">✏️ Edit order</button>';
      html += '<button class="btn btn-sm btn-ghost" data-start-cancel="' + order.id + '" style="color:var(--red)">Cancel order</button>';
      html += '</div>';
    }
    if(state.ui.cancelling === order.id){
      html += '<div class="cancel-confirm"><span class="hint">Cancel order ' + esc(order.tokenDisplay) + '? This can\'t be undone.</span>' +
        '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn btn-danger btn-sm" data-confirm-cancel="' + order.id + '">Yes, cancel</button>' +
        '<button class="btn btn-ghost btn-sm" id="btn-dismiss-cancel">No, keep it</button></div></div>';
    }

    if(order.status === "COMPLETED" && !order.reviewed){
      var draftRating = state.ui.reviewDraftRating || 0;
      html += '<div class="review-box">';
      html += '<div class="review-box-head">⭐ Rate your experience</div>';
      html += '<div class="star-row" data-order="' + order.id + '">';
      for(var si=1; si<=5; si++){
        html += '<button type="button" class="star-btn' + (si<=draftRating ? ' on' : '') + '" data-star="' + si + '">★</button>';
      }
      html += '</div>';
      html += '<textarea id="in-review-comment" placeholder="Anything you\'d like to share? (optional)">' + esc(state.ui.reviewDraftComment) + '</textarea>';
      html += '<button class="btn btn-owner btn-sm" data-full data-submit-review="' + order.id + '">Submit feedback</button>';
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }

  function renderCartPanel(openForOrders){
    var lines = cartLines();
    var total = cartTotal(lines);
    var u = state.ui;
    var deliveryOn = state.shop.deliveryEnabled;

    var editing = !!state.ui.editingOrderId;
    var editingOrder = editing ? state.orders.find(function(o){ return o.id === state.ui.editingOrderId; }) : null;

    var html = '<div class="card accent-customer">';
    html += '<h2>' + (editing ? "Update your order" : "Your order") + '</h2>';
    if(lines.length === 0){
      html += '<div class="empty-note">Add items from the menu to start an order.</div>';
    } else {
      lines.forEach(function(l){
        html += '<div class="cart-line"><span>' + l.qty + '× ' + esc(l.item.name) + '</span><span style="display:flex;align-items:center;gap:8px"><span class="mono">' + money(l.item.price*l.qty) + '</span><button class="x" data-remove="' + l.item.id + '">✕</button></span></div>';
      });
      html += '<div class="cart-total"><span>Total</span><span class="mono">' + money(total) + '</span></div>';

      html += '<div style="margin-top:16px">';
      html += '<div class="fulfil-toggle">';
      html += '<button data-fulfil="PICKUP" aria-pressed="' + (u.fulfilment==="PICKUP") + '">🚶 Pickup<small>ready at counter</small></button>';
      html += '<button data-fulfil="DELIVERY" aria-pressed="' + (u.fulfilment==="DELIVERY") + '" ' + (deliveryOn?'':'disabled') + '>🛵 Delivery<small>' + (deliveryOn?'to your address':'currently off') + '</small></button>';
      html += '</div>';

      html += '<div class="field"><label>Your name</label><input type="text" id="in-name" value="' + esc(u.name) + '" placeholder="e.g. Asha Kulkarni"></div>';
      html += '<div class="field"><label>Mobile number</label><input type="tel" id="in-phone" value="' + esc(u.phone) + '" placeholder="10-digit mobile"></div>';
      if(u.fulfilment === "DELIVERY"){
        html += '<div class="field"><label>Delivery address</label><textarea id="in-address" placeholder="Flat / building, street, landmark">' + esc(u.address) + '</textarea></div>';
      }
      html += '<div class="field"><label>Notes (optional)</label><input type="text" id="in-notes" value="' + esc(u.notes) + '" placeholder="e.g. less spicy, no ghee"></div>';
      html += '<div id="cart-err" class="err" style="display:none"></div>';
      html += '<button class="btn btn-primary" data-full id="btn-place" ' + (openForOrders?'':'disabled') + '>' + (editing ? "Save changes" : "Place order — pay at hub") + '</button>';
      if(!openForOrders) html += '<div class="hint" style="margin-top:8px;text-align:center">Ordering opens once the hub is open.</div>';
      html += '<div class="hint" style="margin-top:8px;text-align:center">' + (editing ? "Updates order " + esc(editingOrder ? editingOrder.tokenDisplay : "") : "No online payment — settle " + money(total) + " at the hub.") + '</div>';
      html += '</div>';
    }
    html += '</div>';

    // order history for this browser
    var mine = todaysAndPastOrders();
    if(mine.length){
      html += '<div class="card">';
      html += '<div class="section-title">Orders from this device</div>';
      mine.slice(0,6).forEach(function(o){
        var isCurrent = o.id === state.ui.activeOrderId;
        html += '<div class="kv-row"><span class="k">' + esc(o.tokenDisplay) + ' · ' + fmtDate(o.serviceDate) + '</span>' +
          '<span class="v" style="display:flex;align-items:center;gap:8px"><span class="status-pill st-' + o.status + '" style="font-size:10px">' + o.status + '</span>' +
          (isCurrent ? '' : '<button class="btn btn-ghost btn-sm" data-view-order="' + o.id + '" style="padding:3px 9px">View</button>') +
          '</span></div>';
      });
      html += '</div>';
    }
    return html;
  }
  function todaysAndPastOrders(){
    return state.orders.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
  }

  /* ---------- Owner view ---------- */
  function ownerView(){
    var tabsHtml = renderOwnerTabs();
    return tabsHtml + (state.ui.ownerTab === "manage" ? renderOwnerManage() : renderOwnerOrders());
  }

  function renderOwnerTabs(){
    var isOrders = state.ui.ownerTab !== "manage";
    return '<div class="owner-tabs">' +
      '<button class="owner-tab-btn" data-owner-tab="orders" aria-pressed="' + isOrders + '">📋 Orders</button>' +
      '<button class="owner-tab-btn" data-owner-tab="manage" aria-pressed="' + (!isOrders) + '">⚙️ Manage hub</button>' +
    '</div>';
  }

  // Orders tab: nothing but the orders themselves — open ones active and on top, closed ones inactive underneath.
  // Total quantity of each item still needed across orders not yet prepared (PENDING/ACCEPTED/PREPARING).
  function prepSummaryToday(){
    var counts = {};
    todaysOrders().forEach(function(o){
      if(ACTIVE_STATUSES.indexOf(o.status) === -1) return;
      o.items.forEach(function(l){ counts[l.name] = (counts[l.name]||0) + l.qty; });
    });
    return Object.keys(counts).map(function(k){ return { name:k, qty:counts[k] }; }).sort(function(a,b){ return b.qty - a.qty; });
  }

  function renderOwnerOrders(){
    var today = todaysOrders();
    var isOpenOrder = function(o){ return o.status !== "COMPLETED" && o.status !== "REJECTED" && o.status !== "CANCELLED"; };
    var openOrders = today.filter(isOpenOrder).sort(function(a,b){ return a.tokenSeq - b.tokenSeq; });
    var closedOrders = today.filter(function(o){ return !isOpenOrder(o); }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });

    var html = '<div class="orders-page-head" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">';
    html += '<div><h2 class="display" style="font-size:20px;margin-bottom:2px">Today\'s orders</h2>';
    html += '<p class="sub">' + fmtDate(todayStr()) + ' · ' + openOrders.length + ' open · ' + closedOrders.length + ' closed</p></div>';
    html += '<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">';
    html += '<div class="voice-toggle-box">' +
      '<label class="switch"><input type="checkbox" id="tg-voice" ' + (state.shop.voiceAnnounce?'checked':'') + '><span class="track"></span></label>' +
      '<span>' + (state.shop.voiceAnnounce ? '🔊 Voice alerts active' : '🔇 Voice alerts inactive') + '</span>' +
      '<button class="btn btn-ghost btn-sm" id="btn-voice-test" type="button">Test</button>' +
    '</div>';
    if(state.ui.pushEnabledHere){
      html += '<div class="voice-toggle-box">🔔 Push notifications on for this device</div>';
    } else if(push.supported){
      html += '<button class="btn btn-owner btn-sm" id="btn-enable-push" type="button">🔔 Enable push notifications</button>';
    }
    html += '</div>';
    html += '</div>';

    if(openOrders.length === 0 && closedOrders.length === 0){
      html += '<div class="empty-state" style="margin-top:30px"><div class="big">🧺</div>No orders yet today.</div>';
      return html;
    }

    var prep = prepSummaryToday();
    if(prep.length){
      html += '<div class="card accent-owner prep-summary">';
      html += '<h2 style="font-size:15px">🍳 Prep summary</h2><p class="sub">Total still to prepare, across all open orders</p>';
      html += '<div class="chip-row">';
      prep.forEach(function(row){ html += '<span class="prep-chip">' + esc(row.name) + ' <b>× ' + row.qty + '</b></span>'; });
      html += '</div></div>';
    }

    if(openOrders.length === 0){
      html += '<div class="hint" style="margin:4px 0 16px">Nothing waiting on you right now.</div>';
    }
    openOrders.forEach(function(o){ html += renderQueueRow(o, true); });
    if(closedOrders.length){
      html += '<div class="section-title" style="margin-top:22px">Closed out today</div>';
      closedOrders.forEach(function(o){ html += renderQueueRow(o, false); });
    }
    return html;
  }

  function renderOwnerManage(){
    var today = todaysOrders();
    var completed = today.filter(function(o){ return o.status === "COMPLETED"; });
    var sales = completed.reduce(function(s,o){ return s + o.total; }, 0);
    var active = today.filter(function(o){ return ACTIVE_STATUSES.indexOf(o.status) !== -1; }).length;
    var cs = computeShopState();

    var html = '<div class="stat-grid" style="margin-top:18px">';
    html += statTile(money(sales), "Sales today");
    html += statTile(today.length, "Orders today");
    html += statTile(active, "Active tokens");
    html += statTile(state.shop.avgPrepMinutes + " min", "Avg prep");
    html += '</div>';

    html += '<div class="grid2">';
    html += '<div>';

    // Daily sales log — per-order log plus a per-item breakdown
    html += '<div class="card accent-owner">';
    html += '<h2>Daily sales log</h2><p class="sub">Every order today, oldest first — for reconciling the till.</p>';
    if(today.length === 0){
      html += '<div class="empty-state"><div class="big">📋</div>Nothing logged yet today.</div>';
    } else {
      var logSorted = today.slice().sort(function(a,b){ return a.tokenSeq - b.tokenSeq; });
      logSorted.forEach(function(o){
        html += '<div class="kv-row"><span class="k">' + esc(o.tokenDisplay) + ' · ' +
          new Date(o.createdAt).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}) + ' · ' + esc(o.name) +
          ' <span class="hint">(' + (o.fulfilment==="DELIVERY"?"delivery":"pickup") + ')</span></span>' +
          '<span class="v">' + money(o.total) + ' <span class="status-pill st-' + o.status + '" style="font-size:9.5px;margin-left:4px">' + o.status + '</span></span></div>';
      });
    }
    var waSummary = waLink(state.shop.ownerWhatsapp, dailySummaryText());
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">';
    if(waSummary){
      html += '<a class="btn btn-owner btn-sm" href="' + waSummary + '" target="_blank" rel="noopener" style="text-decoration:none">📲 Send summary to WhatsApp</a>';
    } else {

  function startOfWeekStr(){
    var now = new Date(nowMs());
    var dow = now.getDay(); // 0 = Sunday
    var sinceMonday = (dow === 0) ? 6 : dow - 1;
    var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - sinceMonday);
    return monday.getFullYear() + "-" + String(monday.getMonth()+1).padStart(2,"0") + "-" + String(monday.getDate()).padStart(2,"0");
  }
  function ordersInPeriod(period){
    var today = todayStr();
    var start = period === "week" ? startOfWeekStr() : period === "month" ? (today.slice(0,7) + "-01") : null;
    return state.orders.filter(function(o){
      if(o.status === "REJECTED" || o.status === "CANCELLED") return false;
      if(period === "all") return true;
      if(period === "today") return o.serviceDate === today;
      return o.serviceDate >= start && o.serviceDate <= today;
    });
  }
  function shopRatingSummary(){
    if(!state.reviews.length) return null;
    var sum = state.reviews.reduce(function(s,r){ return s + (r.rating||0); }, 0);
    return { avg: sum / state.reviews.length, count: state.reviews.length };
  }
  function submitReview(orderId, rating, comment){
    var o = state.orders.find(function(x){ return x.id === orderId; });
    if(!o || !(rating >= 1 && rating <= 5)) return;
    var review = {
      orderId: orderId, tokenDisplay: o.tokenDisplay, name: o.name,
      rating: rating, comment: (comment||"").trim(), createdAt: nowMs()
    };
    // Only clear the draft / mark reviewed / say "thanks" once the write is actually
    // confirmed — previously this fired unconditionally, so a rejected write (e.g. a
    // database-rules gap) still told the customer it worked while the owner never saw it.
    function onSaved(){
      patchOrderCloud(orderId, { reviewed: true });
      state.ui.reviewDraftRating = 0; state.ui.reviewDraftComment = "";
      persist(); render();
      toast("Thanks for your feedback!");
    }
    if(cloud.enabled){
      cloud.db.ref("reviews").push(review).then(onSaved).catch(function(){
        toast("Couldn't submit your review — check your connection and try again.");
      });
    } else {
      review.id = uid(); state.reviews.push(review);
      onSaved();
    }
  }
  function itemSalesForPeriod(period){
    var counts = {};
    ordersInPeriod(period).forEach(function(o){
      o.items.forEach(function(l){
        if(!counts[l.name]) counts[l.name] = { name:l.name, qty:0, revenue:0 };
        counts[l.name].qty += l.qty;
        counts[l.name].revenue += l.qty * l.price;
      });
    });
    return Object.keys(counts).map(function(k){ return counts[k]; }).sort(function(a,b){ return b.qty - a.qty; });
  }

  var STAGE_ORDER = ["PENDING","ACCEPTED","PREPARING","READY","COMPLETED"];
  var STAGE_LABEL = { PENDING:"Placed", ACCEPTED:"Accepted", PREPARING:"Preparing", READY:"Ready", COMPLETED:"Done" };
  function completeLabel(o){ return o.fulfilment === "DELIVERY" ? "Home Delivered" : "Collected at Hub"; }
  function renderStageTimeline(o){
    if(o.status === "REJECTED" || o.status === "CANCELLED"){
      var bt = o.stageTimes && o.stageTimes[o.status];
      return '<div class="stage-line">✕ ' + (o.status==="REJECTED"?"Rejected":"Cancelled") + (bt ? (" · " + fmtTime(bt)) : "") + '</div>';
    }
    var idx = STAGE_ORDER.indexOf(o.status);
    var html = '<div class="stage-line">';
    STAGE_ORDER.forEach(function(s, i){
      var reached = i <= idx;
      var t = o.stageTimes && o.stageTimes[s];
      var label = s === "COMPLETED" ? completeLabel(o) : STAGE_LABEL[s];
      html += '<span class="stage-dot' + (reached?' reached':'') + (i===idx?' current':'') + '">' + label + (reached && t ? ('<b>'+fmtTime(t)+'</b>') : '') + '</span>';
      if(i < STAGE_ORDER.length-1) html += '<span class="stage-sep' + (i<idx?' done':'') + '"></span>';
    });
    html += '</div>';
    return html;
  }

  function onAppClick(e){
    var t = e.target;
    var id;

    if(t.id === "pin-backdrop"){ state.ui.showPin = false; persist(); render(); return; }
    if(t.id === "btn-pin-cancel"){ state.ui.showPin = false; persist(); render(); return; }
    if(t.id === "btn-pin-submit"){ submitPin(); return; }

    if(t.id === "cust-login-backdrop"){ state.ui.showCustLogin = false; persist(); render(); return; }
    if(t.id === "btn-cust-login-cancel"){ state.ui.showCustLogin = false; persist(); render(); return; }
    if(t.id === "btn-cust-login-submit"){ submitCustLogin(); return; }

    var ownerTab;
    if((ownerTab = attr(t,"data-owner-tab"))){ state.ui.ownerTab = ownerTab; persist(); render(); return; }

  function placeOrder(){
    var lines = cartLines();
    var errBox = document.getElementById("cart-err");
    function showErr(msg){ if(errBox){ errBox.style.display="block"; errBox.textContent = msg; } }
    if(lines.length === 0) return;
    var name = (state.ui.name||"").trim();
    var phone = (state.ui.phone||"").trim();
    if(!name){ showErr("Please enter your name."); return; }
    if(!/^\d{10}$/.test(phone.replace(/\D/g,""))){ showErr("Please enter a valid 10-digit mobile number."); return; }
    var address = (state.ui.address||"").trim();
    if(state.ui.fulfilment === "DELIVERY" && !address){ showErr("Please enter a delivery address."); return; }
    if(cartTotal(lines) > 50000){ showErr("This order total looks unusually high — please call the shop directly for bulk orders."); return; }
    state.ui.customerLoggedIn = true;

    if(state.ui.editingOrderId){
      var editId = state.ui.editingOrderId;
      var existing = state.orders.find(function(o){ return o.id === editId; });
      if(!existing || existing.status !== "PENDING"){
        toast("This order can no longer be edited — the shop may have already acted on it.");
        state.ui.editingOrderId = null; render(); return;
      }
      patchOrderCloud(editId, {
        items: lines.map(function(l){ return { name:l.item.name, price:l.item.price, qty:l.qty }; }),
        total: cartTotal(lines),
        fulfilment: state.ui.fulfilment,
        address: state.ui.fulfilment==="DELIVERY" ? address : "",
        notes: (state.ui.notes||"").trim(),
        name: name, phone: phone,
        updatedAt: nowMs(),
        customerActionAt: nowMs(),
        customerActionType: "EDITED"
      });
      state.ui.editingOrderId = null;
      state.ui.cart = {};
      state.ui.activeOrderId = editId;
      persist(); render();
      toast("Order " + existing.tokenDisplay + " updated");
      return;
    }

    function finish(seq){
      if(seq == null){ showErr("Could not reach the shop right now — please try again."); return; }
      var id = (cloud.enabled && cloud.db) ? cloud.db.ref("orders").push().key : uid();
      var order = {
        id: id,
        tokenSeq: seq,
        tokenDisplay: tokenDisplay(seq),
        serviceDate: todayStr(),
        name: name, phone: phone,
        fulfilment: state.ui.fulfilment,
        address: state.ui.fulfilment==="DELIVERY" ? address : "",
        items: lines.map(function(l){ return { name:l.item.name, price:l.item.price, qty:l.qty }; }),
        total: cartTotal(lines),
        notes: (state.ui.notes||"").trim(),
        status: "PENDING",
        paymentStatus: "DUE",
        rejectReason: "",
        createdAt: nowMs(),
        updatedAt: nowMs(),
        stageTimes: { PENDING: nowMs() }
      };
      state.orders.push(order);
      if(cloud.enabled) cloud.db.ref("orders/" + id).set(order);
      state.ui.cart = {};
      state.ui.notes = "";
      state.ui.activeOrderId = order.id;
      persist();
      render();
      toast("Order placed — token " + order.tokenDisplay);
    }

    if(cloud.enabled) allocateTokenCloud(finish);
    else finish(allocateToken());
  }

  // Loads an existing PENDING order's items back into the cart for editing. Items are
  // matched back to the live menu by name (orders only ever store a name/price/qty
  // snapshot, not a menu item id) — anything since removed from the menu is dropped
  // with a note rather than silently kept as a ghost line.
  function startEditOrder(id){
    var o = state.orders.find(function(x){ return x.id === id; });
    if(!o || o.status !== "PENDING") return;
    var cart = {}, missing = [];
    o.items.forEach(function(item){
      var m = state.menu.find(function(mm){ return mm.name === item.name; });
      if(m) cart[m.id] = (cart[m.id]||0) + item.qty;
      else missing.push(item.name);
    });
    state.ui.cart = cart;
    state.ui.fulfilment = o.fulfilment;
    state.ui.address = o.address || "";
    state.ui.notes = o.notes || "";
    state.ui.editingOrderId = id;
    state.ui.cancelling = null;
    persist(); render();
    if(missing.length) toast(missing.join(", ") + " no longer on the menu — left out of the edit");
  }
